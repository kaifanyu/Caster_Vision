input:
  path: data/clip.mp4
  type: auto
  max_frames: null
  fps_override: null

assumptions:
  # Confirm these against the actual recording before running.
  camera_fixed_to_chassis: true
  ball_center_stationary_in_image: true
  two_speckle_colors: true

camera:
  # Replace null with [[fx, 0, cx], [0, fy, cy], [0, 0, 1]], or run
  # scripts/calibrate_camera.py. When null, fov_deg is used with a warning.
  K: null
  dist: [0, 0, 0, 0, 0]
  fov_deg: 60.0

circle:
  # Fill these from scripts/calibrate_circle.py, or leave all null to auto-fit.
  u0: null
  v0: null
  r_px: null
  refit_each_frame: false

segment:
  mode: color                  # color | equator
  # Defaults match the synthetic renderer. Tune with scripts/inspect_hsv.py.
  top_hsv: {lo: [170, 90, 60], hi: [10, 255, 255]}
  bottom_hsv: {lo: [85, 90, 60], hi: [105, 255, 255]}
  # Set enabled false if the real yoke is not reliably separable by HSV.
  yoke_hsv: {lo: [0, 0, 0], hi: [179, 255, 55], enabled: true}
  morphology_px: 1
  # Sparse printed marks on a plain shell leave most of the surface untrackable.
  # grow_px dilates each colour mask so the surface between the marks is usable;
  # separation_px keeps the grown regions clear of each other across the seam.
  # Leave grow_px at 0 for dense speckle, which needs no help.
  grow_px: 0.0
  separation_px: 0.0
  yoke_dilate_px: 0.0
  # A pixel that matched a speckle colour is speckle, not yoke. The yoke range
  # is a catch-all for dark pixels and is subtracted before the hemispheres.
  color_wins_over_yoke: false
  equator:
    angle_deg: 0.0
    offset_px: 0.0
    deadband_px: 3.0

track:
  max_corners: 400
  quality: 0.01
  min_distance_px: 6
  klt_win: 21
  pyramid_levels: 3
  fwd_bwd_err_px: 1.0
  limb_cull_deg: 65.0

estimate:
  ransac_iters: 200
  ransac_inlier_deg: 1.0
  min_inliers: 8
  random_seed: 7

frame_calib:
  # Ball-to-camera orientation. Fill from scripts/calibrate_axes.py.
  R_bc: null

output:
  dir: out/real
  save_overlay_video: true
  overlay_codec: mp4v
